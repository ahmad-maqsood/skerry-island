name: Deploy Website to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "website/**"
      - "docs/assets/screenshots/**"
      - "src-tauri/icons/mark.svg"
      - "src/features/appearance/types.ts"
      - "package.json"
      - "src-tauri/Cargo.toml"
      - ".github/workflows/deploy-pages.yml"
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to build from (leave blank for the selected branch)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install website dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Sync screenshots, mark, release sizes, and repo metrics
        env:
          SKERRY_REPO: ${{ github.repository }}
          SKERRY_REF: ${{ inputs.ref || github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNC_STRICT: "true"
        run: npm run sync-assets

      - name: Determine Vite base path
        id: base
        shell: bash
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [ -n "$CUSTOM_DOMAIN" ]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/${REPO_NAME}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build production website
        env:
          VITE_BASE_PATH: ${{ steps.base.outputs.path }}
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./website/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
