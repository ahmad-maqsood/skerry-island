name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'website/**'
  # Every pull request is tested when it is opened (or reopened) and again on each new push to it.
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'website/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Jobs run side by side, so a run takes as long as its slowest job, not the sum of them.
# Only work that needs Windows runs on Windows (the Rust app and the browser pages that
# compare line-wrapping in Windows fonts); the rest runs on Linux, which starts faster.
# Pushes to main, pull requests and manual runs all run everything.
jobs:
  checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Type check, lint, file size and unit tests.
      - name: Check
        run: pnpm check

      # `pnpm build` would type check a second time; `pnpm check` just did.
      - name: Build frontend
        run: pnpm exec vite build

      - name: Check the run left the repository clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The run changed or created files in the repository:"
            git status --porcelain
            exit 1
          fi

  regression:
    name: Browser pages (${{ matrix.shard }}/3)
    # The app's fonts (Segoe UI, Microsoft YaHei) are Windows fonts; line-wrapping checks in the
    # regression pages only match on a Windows runner.
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Each shard runs a third of the pages in tests/regression/ using the Chrome on the runner.
      - name: Browser regression pages
        shell: bash
        run: node scripts/run-regression.mjs --shard=${{ matrix.shard }}/3

      - name: Check the run left the repository clean
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The run changed or created files in the repository:"
            git status --porcelain
            exit 1
          fi

  clippy:
    name: Clippy
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v6

      # Same version as rust-toolchain.toml; change both together.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # CARGO_TARGET_DIR above puts build output in <repo>/target, not in src-tauri/target or
          # plugins/target, where rust-cache looks by default. Without the `->` mapping it cached
          # only the downloaded sources (~150 MB) and every run recompiled all ~420 crates.
          workspaces: |
            src-tauri -> ../target
            plugins -> ../target
          shared-key: skerry-clippy

      - name: Clippy (app)
        shell: bash
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Clippy (plugins)
        shell: bash
        run: cargo clippy --manifest-path plugins/Cargo.toml --workspace --all-targets -- -D warnings

  rust-tests:
    name: Rust tests
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      RUST_BACKTRACE: 1
      # Full debug info makes the Windows linker slow and the cache large. Line tables keep
      # file and line numbers in a failing test's backtrace.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v6

      # Same version as rust-toolchain.toml; change both together.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # CARGO_TARGET_DIR above puts build output in <repo>/target, not in src-tauri/target or
          # plugins/target, where rust-cache looks by default. Without the `->` mapping it cached
          # only the downloaded sources (~150 MB) and every run recompiled all ~420 crates.
          workspaces: |
            src-tauri -> ../target
            plugins -> ../target
          shared-key: skerry-test

      # --lib: the app has no doctests or integration tests, and without it Cargo also builds
      # the whole app a second time as a plain library and binary just to run nothing.
      - name: Rust tests (app)
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Plugin tests
        shell: bash
        run: cargo test --manifest-path plugins/Cargo.toml --workspace

  ci-passed:
    name: "CI passed"
    runs-on: ubuntu-latest
    needs: [checks, regression, clippy, rust-tests]
    if: always()
    steps:
      - name: Check status of parallel jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "A CI job did not succeed."
              exit 1
            fi
          done
          echo "All CI jobs passed successfully."
